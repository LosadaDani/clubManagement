<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<!--/* Pàgina 404 per a navegadors (#98). Spring Boot la fa servir sola quan una petició amb
     Accept: text/html acaba en 404 (reenviament intern a /error); no cal Controller.
     <head> propi en lloc del fragment head(titol, descripcio, ruta): aquí no hi ha canònica,
     perquè l'adreça pot ser qualsevol, i sí noindex. Charset, viewport, favicon i CSS, els
     mateixos que el fragment. Rutes sempre des de l'arrel: la pàgina es pot servir a /a/b/c. */-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pàgina no trobada · Club d'Agility Maresme</title>
    <meta name="description" content="La pàgina que busques no existeix al web del Club d'Agility Maresme.">
    <meta name="robots" content="noindex">
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!--/* null: no coincideix amb cap pàgina, i cap enllaç del menú porta aria-current. */-->
<header th:replace="~{fragments/header :: header(null)}"></header>

<!--/* Obertura com la d'El club (.pagina i .pagina h1) amb l'entradeta d'Escola (.es-entradeta). */-->
<main class="pagina">
    <div class="contenidor">
        <h1>Pàgina no trobada</h1>
        <p class="es-entradeta">L'adreça que has escrit no existeix o la pàgina s'ha mogut.</p>
        <a class="btn er-accio" th:href="@{/}">Torna a l'inici</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
