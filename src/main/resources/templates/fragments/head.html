<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<!-- Fragment <head> comú. Paràmetres: títol, meta description i ruta canònica de cada pàgina
     ('/' o '/el-club', sense barra final). La URL base només s'escriu aquí (th:with="base=..."),
     i la fan servir la canònica, og:url i og:image. Etiquetes og:*: vista prèvia en compartir
     l'enllaç, amb la imatge static/img/og-maresme-1200.jpg (1200x630). -->
<head th:fragment="head(titol, descripcio, ruta)" th:with="base='https://agilitymaresme.com'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titol}">Club d'Agility Maresme</title>
    <meta name="description" th:content="${descripcio}">
    <link rel="canonical" th:href="${base} + ${ruta}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Club d'Agility Maresme">
    <meta property="og:locale" content="ca_ES">
    <meta property="og:title" th:content="${titol}">
    <meta property="og:description" th:content="${descripcio}">
    <meta property="og:url" th:content="${base} + ${ruta}">
    <meta property="og:image" th:content="${base} + '/img/og-maresme-1200.jpg'">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Logotip del club: un gos blau en ple salt">
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
</html>
