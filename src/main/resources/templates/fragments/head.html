<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<!-- Fragment <head> comú. Paràmetres: títol i meta description de cada pàgina. -->
<head th:fragment="head(titol, descripcio)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titol}">Club d'Agility Maresme</title>
    <meta name="description" th:content="${descripcio}">
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
</html>
